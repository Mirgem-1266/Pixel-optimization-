
name: Build Pixel RAM Optimizer APK

on:
  push:
    branches:
      - main
    paths:
      - '**/*Optimizer*Source*.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Find and extract version 2.1 source ZIP
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source"

          echo "Searching for version 2.1 source archive..."

          mapfile -t ARCHIVES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*2.1*Source*.zip' \
              -not -path '*/.git/*'
          )

          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "Version 2.1 archive not found."
            echo "Searching for another Optimizer source archive..."

            mapfile -t ARCHIVES < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*Optimizer*Source*.zip' \
                -not -path '*/.git/*'
            )
          fi

          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "ERROR: Source ZIP not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f
            exit 1
          fi

          if [ "${#ARCHIVES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple source ZIP files found:"
            printf '%s\n' "${ARCHIVES[@]}"
            echo "Keep only the intended version 2.1 archive."
            exit 1
          fi

          ZIP_FILE="${ARCHIVES[0]}"

          echo "Found archive: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          echo "Archive extracted successfully."

      # 3. Locate actual Android Gradle project
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle settings..."

          SETTINGS=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name settings.gradle.dcl \) \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found!"
            find "$GITHUB_WORKSPACE/source" -maxdepth 7 -type f
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"

          echo "Detected project: $PROJECT_DIR"
          echo "Settings file: $SETTINGS"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.dcl" ]; then
            echo "ERROR: Root Gradle build file not found!"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 4. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. Configure Android SDK already available on runner
      - name: Set up Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not configured."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            find "$ANDROID_HOME" -name sdkmanager -type f
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Configure Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Starting Android build..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 8. Find and verify generated APK
      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Searching for generated APK..."

          mapfile -t APK_FILES < <(
            find . -type f \
              -path '*/build/outputs/apk/debug/*.apk'
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Debug APK not found!"
            find . -type f -name '*.apk'
            exit 1
          fi

          echo "Generated APK files:"
          printf '%s\n' "${APK_FILES[@]}"

          APK_PATH="$(realpath "${APK_FILES[0]}")"

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # 9. Upload APK to GitHub Actions artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Pixel-RAM-Optimizer-2.1-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
