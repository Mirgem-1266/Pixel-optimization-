
name: Build Pixel RAM Optimizer APK

on:
  push:
    branches:
      - main
    paths:
      - 'Pixel8_RAM_Optimizer_v2.1_Source.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Завантаження репозиторію
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Розпакування Android-проєкту
      
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname '*Optimizer*Source*.zip' \
            ! -path './.git/*' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android source ZIP not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      # 4. Встановлення Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. Налаштування Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 6. Встановлення Android SDK пакетів
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Налаштування Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Перевірка та складання APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 9. Перевірка наявності APK
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 10. Завантаження готового APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-RAM-Optimizer-2.0-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      
